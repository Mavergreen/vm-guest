name: ci

# What this repository can check without a Mac, a KVM host or 6 GB of
# Apple's media: the whole test suite, the shell floor, the Tier 0/1/2
# provenance gate, the three checks that guard the ingredient registry,
# and that `vmavs emit packer`'s template validates against real Packer.
#
# What it deliberately does NOT check: that an image builds. That needs
# nested virtualization, an InstallESD this project must never publish, and
# half an hour. image/build-image.sh is exercised on the host it is for;
# NOTES.md is where those runs are written down.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so bin/verify-changed-sources.sh has a base revision
      # to diff vendor/sources.tsv against. With a shallow clone it would
      # find none and skip -- silently, which is the failure mode that
      # check exists to prevent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck

      - name: Test suite, shell floor and tier-check --strict
        run: ./bin/run-tests.sh

      # OURS ALONE: a release must contain no Apple-derived bytes. It passes
      # by construction -- the tool fetches Apple's media at runtime, on the
      # user's machine -- which is precisely why it is asserted rather than
      # assumed. See bin/no-apple-bytes.sh.
      - name: No Apple-derived bytes in a release
        run: ./bin/no-apple-bytes.sh

      # A Renovate bump moves a URL in vendor/sources.tsv and cannot compute
      # the checksum beside it. Without this the resulting PR is green and
      # the shared preset automerges a pin that will fail at fetch time.
      - name: Every changed source pin still verifies
        run: ./bin/verify-changed-sources.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  ingredient-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out shipyard (for the gate script)
        uses: actions/checkout@v7
        with:
          repository: Mavergreen/shipyard
          ref: v1
          path: .shipyard

      # Guards the ingredient-pin declaration against a glob that matches
      # nothing. We declare no repackage-on-ingredient-bump caller -- we
      # ship a recipe, so there is no artifact to repackage; INGREDIENTS.md
      # says so with the reason -- and this check passes trivially for a
      # repo with no caller. It is here so that the day a caller lands, the
      # gate is already watching it.
      - name: Ingredient pin declaration
        run: sh .shipyard/scripts/check-ingredient-pins.sh

      # An INGREDIENTS.md deviation with no reason is indistinguishable from
      # drift, so the family's own parser rejects it. Both of ours come from
      # decisions/0007.
      - name: Declared deviations all carry a reason
        run: sh .shipyard/scripts/deviations.sh .

  # `vmavs emit packer` writes a template this project never builds from.
  # Validating it here is the one check it can get without Apple's media:
  # packer validate resolves every field name, nesting and type against
  # the real qemu and vagrant plugins. The first run of this (by hand,
  # 2026-09-24, NOTES.md) found two defects no reading of the docs had.
  # It proves the template parses, not that a build works.
  packer-validate:
    runs-on: ubuntu-latest
    env:
      PACKER_VERSION: "1.16.1"
      # packer init fetches plugins through the GitHub API; unauthenticated
      # it shares the runner's rate limit.
      PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-packer@v3.4.0
        with:
          version: ${{ env.PACKER_VERSION }}

      # Every profile, not one: the values and the drive mapping come from
      # the profile, so each one is a different template. --check supplies
      # placeholder variables and a throwaway key, which is what validate
      # needs; it does not run init itself, because it will not download.
      - name: Every profile's Packer template validates
        run: |
          set -eu
          for f in vm/profiles/*.args; do
              p=$(basename "$f" .args)
              out="$RUNNER_TEMP/$p.pkr.hcl"
              echo "::group::$p"
              ./bin/vmavs emit packer --profile "$p" --out "$out"
              packer init "$out"
              ./bin/vmavs emit packer --profile "$p" --out "$out" --check
              echo "::endgroup::"
          done

  # The Go vmavs (docs/superpowers/specs/2026-09-24-vmavs-in-go-design.md).
  # Builds for every host the tool targets, not only the one CI runs on:
  # a darwin or netbsd build break is found here, not by a user.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Cross-build
        run: |
          set -eu
          for target in linux/amd64 darwin/amd64 darwin/arm64 netbsd/amd64; do
              GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/vmavs
          done
